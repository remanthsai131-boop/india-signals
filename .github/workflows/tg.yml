name: telegram-commands
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: telegram-commands
  cancel-in-progress: false
jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: check
        run: python tg_listen.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt
      - if: steps.check.outputs.run == 'true'
        run: python india_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html docs/signals.json journal/paper_trades.csv
          git commit -m "telegram update" || echo "no changes"
          git pull --rebase
          git push
