name: live-status
on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live-status
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt smartapi-python pyotp
      - run: python live_update.py
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/live.json
          git commit -m "live status" || echo "no changes"
          git pull --rebase
          git push
