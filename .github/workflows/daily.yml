name: daily-signals
on:
  schedule:
    - cron: "0 3 * * 1-5"
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python india_market_brief.py
      - run: |
          git config user.name "signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html
          git commit -m "update signals" || echo "no changes"
          git push
