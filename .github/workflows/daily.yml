name: daily-signals
on:
  schedule:
    - cron: "0 3 * * 1-5"
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python india_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python pro_engine.py
      - run: python compare.py
      - run: |
          git config user.name "signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html docs/signals.json docs/pro.html docs/pro.json journal/paper_trades.csv
          git commit -m "update signals" || echo "no changes"
          git pull --rebase
          git push
